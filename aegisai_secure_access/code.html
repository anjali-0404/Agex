<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AegisAI - Secure Access</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <style>
    :root {
      --bg: #080c18;
      --primary: #6366f1;
      --secondary: #a855f7;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --input-bg: #111827;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
    }

    /* Layout */
    .split-layout {
      display: flex;
      width: 100%;
      height: 100vh;
    }

    .panel-left {
      flex: 1;
      position: relative;
      background-color: var(--bg);
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 4rem;
      overflow: hidden;
    }

    .panel-right {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background-image:
        radial-gradient(ellipse 80% 60% at 20% 0%, rgba(99,102,241,0.1) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 80% 100%, rgba(168,85,247,0.08) 0%, transparent 60%);
    }

    /* Left Panel Styling */
    .bg-image {
      position: absolute;
      inset: 0;
      background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCzZIsI3YJeSAS2L-IVgG8HhxcRt_DhmlhUgflbYb7XxhyZnXGU4euB6FBRqyf0NacYRy3ET9B3ZIKhcREN7gRC6adKU1r4K4JUiD5z2ExNjgz8cDqxgFud51kLkpgEOrzlHfjsGgBTW-Nq3cZ9t-jPG09UzcgYKy8noQCJS1N1JclBg-6F2wKJSrdRhxjXZsoib8QkILbCvRNbcu-MbnJ4k66Wr7w1IRkAzkltBXf5N5cAbdSPXbW6Ud5TKn4gO09dM-dy_IIjq6fb');
      background-size: cover;
      background-position: center;
      opacity: 0.3;
      z-index: 1;
    }
    .bg-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(8,12,24,0.7) 0%, rgba(8,12,24,1) 100%);
      z-index: 2;
    }

    .brand-content {
      position: relative;
      z-index: 10;
      animation: fade-up 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .brand-title {
      font-size: 4rem;
      font-weight: 900;
      letter-spacing: -1px;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 16px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .glass-quote {
      position: absolute;
      bottom: 4rem;
      left: 4rem;
      right: 4rem;
      z-index: 10;
      background: rgba(255,255,255,0.03);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      padding: 2rem;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
      animation: fade-up 1s cubic-bezier(0.16, 1, 0.3, 1) both 0.2s;
    }
    .glass-quote p { font-size: 1.25rem; font-weight: 500; line-height: 1.6; color: var(--text-main); }

    /* Right Panel (Form) */
    .form-card {
      width: 100%;
      max-width: 440px;
      background: rgba(255,255,255,0.03);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 10px 40px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.05);
      border-radius: 24px;
      padding: 2.5rem;
      animation: fade-up 0.6s cubic-bezier(0.16, 1, 0.3, 1) both 0.1s;
    }

    .form-header { text-align: center; margin-bottom: 2rem; }
    .form-header h2 { font-size: 1.75rem; font-weight: 700; margin-bottom: 0.5rem; }
    .form-header p { color: var(--text-muted); font-size: 0.95rem; }
    
    .mobile-logo { display: none; text-align: center; margin-bottom: 2rem; }
    .mobile-logo .brand-title { font-size: 2.5rem; justify-content: center; }

    /* Form Elements */
    .form-group { margin-bottom: 1.5rem; position: relative; }
    .form-label { display: block; font-size: 0.85rem; font-weight: 500; color: var(--text-muted); margin-bottom: 0.5rem; }
    .form-control {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--text-main);
      padding: 14px 16px;
      border-radius: 12px;
      font-size: 1rem;
      font-family: 'Inter', sans-serif;
      transition: all 0.2s;
    }
    .form-control:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99,102,241,0.25);
    }
    .form-control::placeholder { color: rgba(255,255,255,0.2); }

    .password-toggle {
      position: absolute; right: 16px; top: 38px; color: var(--text-muted); cursor: pointer; background: transparent; border: none; padding: 0; display: flex; align-items: center; justify-content: center; transition: color 0.2s;
    }
    .password-toggle:hover { color: var(--text-main); }

    .form-options { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; font-size: 0.85rem; }
    .checkbox-group { display: flex; align-items: center; gap: 8px; cursor: pointer; color: var(--text-muted); }
    .checkbox-group input { accent-color: var(--primary); width: 16px; height: 16px; cursor: pointer; }
    .forgot-link { color: var(--primary); text-decoration: none; font-weight: 500; transition: color 0.2s; }
    .forgot-link:hover { color: #818cf8; }

    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 15px rgba(99,102,241,0.3);
    }
    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(99,102,241,0.4);
    }

    .divider { display: flex; align-items: center; text-align: center; margin: 1.5rem 0; color: rgba(255,255,255,0.2); font-size: 0.85rem; }
    .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .divider:not(:empty)::before { margin-right: 1rem; }
    .divider:not(:empty)::after { margin-left: 1rem; }

    .social-btns { display: flex; gap: 1rem; }
    .btn-social {
      flex: 1;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--text-main);
      padding: 12px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: 500;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-social:hover { background: rgba(255,255,255,0.1); }

    .signup-link { text-align: center; margin-top: 2rem; font-size: 0.9rem; color: var(--text-muted); }
    .signup-link a { color: var(--text-main); font-weight: 600; text-decoration: none; margin-left: 4px; border-bottom: 1px solid var(--primary); padding-bottom: 2px; }

    @keyframes fade-up { 
      from { opacity: 0; transform: translateY(20px); } 
      to { opacity: 1; transform: translateY(0); } 
    }

    /* Responsive */
    @media (max-width: 900px) {
      .panel-left { display: none; }
      .mobile-logo { display: block; }
      .panel-right { padding: 1.5rem; align-items: flex-start; padding-top: 10vh; }
      .form-card { box-shadow: none; border: none; background: transparent; padding: 0; }
    }
  </style>
</head>
<body>

  <div class="split-layout">
    
    <!-- Left Panel -->
    <div class="panel-left">
      <div class="bg-image"></div>
      <div class="bg-overlay"></div>
      
      <div class="brand-content">
        <h1 class="brand-title">
          <span class="material-symbols-rounded" style="font-size: 4rem; color: var(--primary);">shield_person</span>
          AegisAI
        </h1>
      </div>

      <div class="glass-quote">
        <p>"Empowering your journey with empathetic technology. Safety doesn't have to be a compromise."</p>
      </div>
    </div>

    <!-- Right Panel -->
    <div class="panel-right">
      <div class="form-card">
        
        <div class="mobile-logo">
          <h1 class="brand-title">
            <span class="material-symbols-rounded" style="font-size: 2.5rem; color: var(--primary);">shield_person</span>
            AegisAI
          </h1>
        </div>

        <div class="form-header">
          <h2>Welcome back</h2>
          <p>Sign in to access your safety dashboard</p>
        </div>

        <form>
          <div class="form-group">
            <label class="form-label">Email address</label>
            <input type="email" class="form-control" placeholder="name@example.com" required>
          </div>

          <div class="form-group">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" placeholder="••••••••" required id="pwdInput">
            <button type="button" class="password-toggle" onclick="togglePassword()">
              <span class="material-symbols-rounded" id="pwdIcon">visibility_off</span>
            </button>
          </div>

          <div class="form-options">
            <label class="checkbox-group">
              <input type="checkbox" checked>
              Remember me
            </label>
            <a href="#" class="forgot-link">Forgot password?</a>
          </div>

          <button type="submit" class="btn-submit">Sign In</button>
        </form>

        <div class="divider">or continue with</div>

        <div class="social-btns">
          <button class="btn-social">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
              <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
              <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
              <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            Google
          </button>
          <button class="btn-social">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
              <path d="M16.365 14.453c-.021-3.125 2.521-4.636 2.635-4.708-1.448-2.115-3.69-2.427-4.51-2.47-1.938-.198-3.784 1.146-4.771 1.146-.979 0-2.521-1.125-4.125-1.094-2.083.031-4.01 1.208-5.083 3.083-2.167 3.76-.552 9.302 1.563 12.354 1.031 1.49 2.219 3.156 3.823 3.094 1.542-.063 2.135-1.01 3.99-1.01 1.844 0 2.396 1.01 3.99 1.042 1.635.031 2.667-1.479 3.688-2.969 1.177-1.708 1.656-3.375 1.677-3.458-.042-.01-3.219-1.229-3.23-5.01zm-2.427-7.469c.844-1.021 1.417-2.438 1.26-3.854-1.208.052-2.688.813-3.552 1.833-.781.885-1.469 2.333-1.292 3.729 1.344.104 2.74-.688 3.584-1.708z"/>
            </svg>
            Apple
          </button>
        </div>

        <div class="signup-link">
          Don't have an account? <a href="#">Create one</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    function togglePassword() {
      const input = document.getElementById('pwdInput');
      const icon = document.getElementById('pwdIcon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.textContent = 'visibility';
      } else {
        input.type = 'password';
        icon.textContent = 'visibility_off';
      }
    }
  </script>
</body>
</html>
